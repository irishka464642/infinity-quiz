d das größte der Welt?","Die Quellen widersprechen sich: GTarcade sagt „richtig“, Fandom „falsch“. Als größtes Hochland gilt meist das Tibetische Hochland."],["Сколько лет длилась Троянская война?","По традиции — 10 лет; в Fandom указано 12. Ответ игры не подтвержден.","How many years did the Trojan War last?","Traditionally 10 years. Fandom lists 12; the in-game answer is unconfirmed.","Wie viele Jahre dauerte der Trojanische Krieg?","Der Überlieferung nach 10 Jahre. Fandom nennt 12; die Spielantwort ist nicht bestätigt."],["Что является оружием Фрейра?","Меч Фрейра. В банках указано Skidbladnir, но это его корабль; ответ игры не подтвержден.","What is Freyr's weapon?","Freyr's sword. Sources list Skidbladnir, his ship; the in-game answer is unconfirmed.","Was ist Freyrs Waffe?","Freyrs Schwert. Die Quellen nennen Skidbladnir, sein Schiff; die Spielantwort ist nicht bestätigt."],["Через сколько стран протекает Амазонка?","Само русло — через Перу, Колумбию и Бразилию. В Fandom указано 7 — вероятно, речь о бассейне. Ответ игры не подтвержден.","How many countries does the Amazon River flow through?","The river flows through Peru, Colombia and Brazil. Fandom lists 7, likely referring to the basin. The in-game answer is unconfirmed.","Durch wie viele Länder fließt der Amazonas?","Der Fluss verläuft durch Peru, Kolumbien und Brasilien. Fandom nennt 7, vermutlich für das Einzugsgebiet. Die Spielantwort ist nicht bestätigt."],["Кто первым получил «Грэмми»?","В Fandom указано Bill Crosby. Без категории и года ответ ненадежен; в первой церемонии было много победителей.","Who won the first Grammy?","Fandom lists Bill Crosby. Without a category or year this is unreliable; the first ceremony had multiple winners.","Wer gewann den ersten Grammy?","Fandom nennt Bill Crosby. Ohne Kategorie oder Jahr ist die Angabe unzuverlässig; bei der ersten Verleihung gab es mehrere Gewinner."],["Варианты ответа зависят от набора","Answers depend on the options","Antworten hängen von den Optionen ab"],["Какими способами можно получить контракт строителя?","В опубликованном наборе: «Все остальные ответы верны». Сверь варианты.","How can you get a Contract Builder?","Published answer: “All other answers are correct.” Check the choices.","Wie kann man einen Bauvertrag erhalten?","Veröffentlichte Antwort: „Alle anderen Antworten sind richtig.“ Prüfe die Optionen."],["Какими способами можно получить фрагменты бессмертных?","В опубликованных наборах: «Все остальные ответы верны». Сверь варианты.","How can you obtain Immortal fragments?","Published answer: “All other answers are correct.” Check the choices.","Wie erhält man Fragmente Unsterblicher?","Veröffentlichte Antwort: „Alle anderen Antworten sind richtig.“ Prüfe die Optionen."],["Какие условия нужны союзу, чтобы короновать короля в «Борьбе за реликвии»?","В опубликованном наборе: «Все остальные ответы верны». Сверь варианты.","What conditions let an alliance crown a king in Contention of Relics?","Published answer: “All other answers are correct.” Check the choices.","Welche Bedingungen muss eine Allianz zur Königskrönung im Reliquienkampf erfüllen?","Veröffentlichte Antwort: „Alle anderen Antworten sind richtig.“ Prüfe die Optionen."],["Какими способами можно сменить расположение территории?","В опубликованном наборе: «Все остальные ответы верны». Сверь варианты.","What methods let you relocate your territory?","Published answer: “All other answers are correct.” Check the choices.","Wie kann man sein Gebiet umsiedeln?","Veröffentlichte Antwort: „Alle anderen Antworten sind richtig.“ Prüfe die Optionen."],["Как лидер может опубликовать событие союза?","В опубликованном наборе: «Все остальные ответы верны». Сверь варианты.","How can an alliance leader publish an alliance event?","Published answer: “All other answers are correct.” Check the choices.","Wie kann ein Allianzleiter ein Allianzereignis veröffentlichen?","Veröffentlichte Antwort: „Alle anderen Antworten sind richtig.“ Prüfe die Optionen."]]</script><script>
'use strict';
const get=id=>document.getElementById(id);
const bank=JSON.parse(get('bank').textContent);
const ui={
ru:['Language','Шпаргалка к викторине','254 вопроса с ответами. Ищи по ключевому слову из вопроса или ответа.','Поиск по вопросам и ответам','Очистить','Все вопросы','Первые 33','Вопрос','Ответ','Нет совпадений. Попробуй другое слово.','Источники:'],
en:['Language','Wisdom Palace quiz guide','254 questions and answers. Search by a keyword from the question or answer.','Search questions and answers','Clear','All questions','First 33','Question','Answer','No matches. Try another keyword.','Sources:'],
de:['Language','Quiz-Spickzettel für den Palast der Weisheit','254 Fragen mit Antworten. Suche nach einem Stichwort aus der Frage oder Antwort. Spielbegriffe sind teilweise frei übersetzt.','Fragen und Antworten durchsuchen','Leeren','Alle Fragen','Erste 33','Frage','Antwort','Keine Treffer. Versuche ein anderes Stichwort.','Quellen:']
};
const langOrder=['ru','en','de'], lang=get('lang'), search=get('search'), tbody=get('rows'), buttons=[...document.querySelectorAll('[data-mode]')];
const set=(id,value)=>{get(id).textContent=value};
const norm=s=>s.toLowerCase().replace(/ß/g,'ss').replace(/ё/g,'е').replace(/й/g,'и').normalize('NFD').replace(/\p{M}/gu,'').replace(/['’‘ʼ]/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const searchable=bank.map(row=>row.length===6?norm(row.join(' ')):'');
let mode='all';
let stored;
try{stored=localStorage.getItem('infinity-quiz-lang')}catch{}
const selected=new URLSearchParams(location.search).get('lang');
lang.value=langOrder.includes(selected)?selected:langOrder.includes(stored)?stored:'ru';
function render(){
 const l=langOrder.indexOf(lang.value), words=norm(search.value).split(' ').filter(Boolean), fragment=document.createDocumentFragment();
 let n=0,index=0,group='',showGroup=false;
 for(let i=0;i<bank.length;i++){
   const row=bank[i];
   if(row.length===3){group=row[l]; showGroup=true;continue}
   index++;
   if((mode==='original'&&index>33)||!words.every(w=>searchable[i].includes(w)))continue;
   if(showGroup){const tr=document.createElement('tr'), th=document.createElement('th');tr.className='group';th.colSpan=2;th.textContent=group;tr.append(th);fragment.append(tr);showGroup=false}
   const tr=document.createElement('tr'), q=document.createElement('td'), a=document.createElement('td'), strong=document.createElement('strong');
   tr.className='qa';q.textContent=row[l*2];strong.textContent=row[l*2+1];a.append(strong);tr.append(q,a);fragment.append(tr);n++;
 }
 tbody.replaceChildren(fragment);set('count',n);get('empty').hidden=n!==0;
}
function localize(){
 const t=ui[lang.value];document.documentElement.lang=lang.value;document.title=t[1]+' · Infinity Kingdom';
 ['lang-label','title','intro',null,'clear',null,null,'question','answer','empty','sources'].forEach((id,i)=>{if(id)set(id,t[i])});
 search.placeholder=t[3];search.setAttribute('aria-label',t[3]);buttons[0].textContent=t[5];buttons[1].textContent=t[6];render();
}
lang.addEventListener('change',()=>{try{localStorage.setItem('infinity-quiz-lang',lang.value)}catch{};const url=new URL(location.href);url.searchParams.set('lang',lang.value);try{history.replaceState(null,'',url)}catch{};localize()});
search.addEventListener('input',render);
get('clear').onclick=()=>{search.value='';render();search.focus()};
for(const b of buttons)b.onclick=()=>{mode=b.dataset.mode;for(const x of buttons)x.setAttribute('aria-pressed',String(x===b));render()};
document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&document.activeElement!==search){e.preventDefault();search.focus()}else if(e.key==='Escape'&&document.activeElement===search){search.value='';render()}});
localize();
</script></body></html>
